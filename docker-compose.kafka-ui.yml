# Kafka UI. Se conecta a los brokers por su listener EXTERNAL, así funciona
# desde esta misma instancia o desde otra de la VPC.
# Uso:  docker compose -f docker-compose.kafka-ui.yml --env-file .env up -d
name: digitalfix-kafka-ui

services:
  kafka-ui:
    image: provectuslabs/kafka-ui:v0.7.2
    container_name: digitalfix-kafka-ui
    restart: unless-stopped
    ports: ["8089:8080"]
    environment:
      KAFKA_CLUSTERS_0_NAME: digitalfix
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: ${KAFKA_HOST:?defina KAFKA_HOST}:9092,${KAFKA_HOST}:9093,${KAFKA_HOST}:9094
      # La UI permite borrar tópicos: se protege con usuario y contraseña.
      AUTH_TYPE: LOGIN_FORM
      SPRING_SECURITY_USER_NAME: ${KAFKA_UI_USER:?defina KAFKA_UI_USER}
      SPRING_SECURITY_USER_PASSWORD: ${KAFKA_UI_PASSWORD:?defina KAFKA_UI_PASSWORD}
      JAVA_OPTS: -Xms128m -Xmx384m
